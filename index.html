<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5Cs Tracker</title>
<style>
body{font-family:Arial;margin:0;background:#f5f1e8}
header{background:#17130f;color:white;padding:18px}
main{padding:16px}
.box{background:white;border-radius:12px;padding:14px;margin:10px 0}
input,button{font-size:16px;padding:12px;width:100%;margin:5px 0;box-sizing:border-box}
button{background:#111;color:white;border:0;border-radius:10px}
</style>
</head>
<body>
<header>
<h1>5Cs Customer Tracker</h1>
</header>

<main>
<div class="box">
<h2>Add Customer</h2>
<input id="customerInput" placeholder="Customer name">
<button id="addBtn">Add Customer</button>
</div>
<div id="list"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAY2Qm46g5CCMiAQsIO4UMM1QMYIMuZMr0",
  authDomain: "cs-tracker-23ef9.firebaseapp.com",
  projectId: "cs-tracker-23ef9",
  storageBucket: "cs-tracker-23ef9.firebasestorage.app",
  messagingSenderId: "107901431900",
  appId: "1:107901431900:web:def2e585c9ce5ea5c37699"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const input = document.getElementById("customerInput");
const list = document.getElementById("list");
const button = document.getElementById("addBtn");

button.addEventListener("click", async function() {
  const customerName = input.value.trim();

  if (!customerName) {
    alert("Type a customer name first");
    return;
  }

  try {
    await addDoc(collection(db, "customers"), {
      name: customerName,
      createdAt: new Date().toISOString()
    });
    input.value = "";
  } catch (error) {
    alert("Firebase error: " + error.message);
  }
});

onSnapshot(collection(db, "customers"), function(snapshot) {
  list.innerHTML = snapshot.docs.map(function(doc) {
    const data = doc.data();
    return "<div class='box'>" + data.name + "</div>";
  }).join("");
}, function(error) {
  alert("Database read error: " + error.message);
});
</script>
</body>
</html>
